name: Deploy to Firebase Hosting

# Deploys the contents of public/ to the Firebase Hosting live channel
# on every push to main.
#
# Required repository secret:
#   FIREBASE_SERVICE_ACCOUNT  - JSON service account key with Hosting deploy
#                               permissions for the Firebase project.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: paul-and-chester
          target: risk
          channelId: live
